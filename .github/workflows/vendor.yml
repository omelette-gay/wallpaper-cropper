name: vendor

# Renovate only changes the version numbers in scripts/vendor.sh, so this downloads the matching files and
# commits them to the pull request
on:
  pull_request:
    paths:
      - scripts/vendor.sh

permissions:
  contents: write

jobs:
  vendor:
    # pull requests from forks can't be pushed to
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: download the vendored files
        run: bash scripts/vendor.sh

      - name: commit any changed files
        run: |
          git add lib models fonts
          if git diff --cached --quiet; then
            echo "vendored files already match scripts/vendor.sh"
            exit 0
          fi
          # Renovate's gitIgnoredAuthors lists this address, so it keeps rebasing the branch after this commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Download vendored files to match scripts/vendor.sh"
          git push
